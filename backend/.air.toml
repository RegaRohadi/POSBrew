root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  entrypoint = ["./tmp/main"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", ".git", ".idea", ".vscode"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  poll = true
  poll_interval = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
